name: Monitor — Auto-retry si no actualizó

# Respaldo del disparo de Supabase (pg_cron). Verifica que cada horario
# (10:45 y 18:00 ARG = 13:45 y 21:00 UTC) haya tenido su actualización;
# si no, la dispara y marca la corrida como fallida: GitHub manda el mail
# de "workflow run failed" automáticamente (sin EmailJS).
on:
  schedule:
    - cron: '15 14 * * *'
    - cron: '30 21 * * *'
    - cron: '30 15,23 * * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  check-and-retry:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}

    steps:
      - name: Verificar último horario y reintentar si falta
        run: |
          python3 << 'EOF'
          import urllib.request, urllib.parse, json, os
          from datetime import datetime, timezone, timedelta

          GH_TOKEN = os.environ['GH_TOKEN']
          REPO = os.environ['REPO']
          SLOTS_UTC = [(13, 45), (21, 0)]  # 10:45 y 18:00 Argentina

          now = datetime.now(timezone.utc)
          today = now.replace(hour=0, minute=0, second=0, microsecond=0)
          slots = [today + timedelta(hours=h, minutes=m) for h, m in SLOTS_UTC]
          slots += [s - timedelta(days=1) for s in slots]
          slot = max(s for s in slots if s <= now)
          print(f"Ahora: {now:%Y-%m-%d %H:%M} UTC — último horario: {slot:%Y-%m-%d %H:%M} UTC")

          def gh(method, path, body=None):
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{REPO}{path}",
                  data=json.dumps(body).encode() if body else None, method=method)
              req.add_header('Authorization', f'Bearer {GH_TOKEN}')
              req.add_header('Accept', 'application/vnd.github+json')
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read() or b'{}')

          def ran_since(workflow, since):
              created = urllib.parse.quote(f">={since:%Y-%m-%dT%H:%M:%SZ}")
              runs = gh('GET', f"/actions/workflows/{workflow}/runs"
                        f"?created={created}&per_page=20")['workflow_runs']
              ok = [r for r in runs if r['status'] != 'completed' or r['conclusion'] == 'success']
              print(f"  {workflow}: {len(runs)} corridas desde {since:%H:%M} UTC, {len(ok)} OK/en curso")
              return bool(ok)

          missing = []
          if not ran_since('update-prices.yml', slot):
              missing.append('update-prices.yml')

          # Super Analyst: días hábiles, después del horario de la mañana
          morning = today + timedelta(hours=SLOTS_UTC[0][0], minutes=SLOTS_UTC[0][1])
          arg_weekday = (now - timedelta(hours=3)).weekday()
          if arg_weekday < 5 and now >= morning and not ran_since('analyze.yml', morning):
              missing.append('analyze.yml')

          if not missing:
              print("OK — todo actualizado. Nada que hacer.")
              raise SystemExit(0)

          for wf in missing:
              try:
                  gh('POST', f"/actions/workflows/{wf}/dispatches", {"ref": "main"})
                  print(f"  {wf} disparado")
              except Exception as e:
                  print(f"  Error disparando {wf}: {e}")

          # Fallar a propósito para que GitHub mande el mail de aviso.
          raise SystemExit(
              f"AVISO: no había corrido {', '.join(missing)} en horario; se reintentó. "
              "Si se repite, revisar el cron de Supabase o si venció el token github_pat (vence 4 ene 2027).")
          EOF
