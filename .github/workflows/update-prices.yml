name: Actualizar precios

on:
  # Lo dispara Supabase (pg_cron) a las 10:45 y 18:00 hora Argentina.
  # No usamos `schedule` de GitHub porque llega con horas de atraso.
  # Respaldo: monitor.yml reintenta si no corrió en horario.
  workflow_dispatch:

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch prices + save to Supabase + check alerts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAILS: ${{ secrets.ALERT_EMAILS }}
        run: python update_prices.py
